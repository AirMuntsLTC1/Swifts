name: ci
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_contracts.py
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: find services/media-php -name '*.php' -exec php -l {} \;
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -c native/src/swifts_core.cpp -Inative/include -o /tmp/core.o
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: cd android && gradle assembleDebug
